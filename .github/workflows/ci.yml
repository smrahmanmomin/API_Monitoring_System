name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apimonitor
          POSTGRES_PASSWORD: apimonitor_dev_password
          POSTGRES_DB: apimonitor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U apimonitor -d apimonitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://apimonitor:apimonitor_dev_password@localhost:5433/apimonitor_test?schema=public
      TEST_DATABASE_URL: postgresql://apimonitor:apimonitor_dev_password@localhost:5433/apimonitor_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
